  background: rgba(0,0,0,0.20);
  padding: .25rem .55rem; border-radius: 4px;
  display: inline-flex; align-items: center; gap: .3rem;
  align-self: flex-start;
  text-transform: uppercase;
}
.rrss-carousel-slide.cta .slide-n { background: rgba(11,10,8,0.35); color: var(--bg); }
.rrss-carousel-slide h6 {
  font-family: var(--rrss-display, 'Bricolage Grotesque'), sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  line-height: 1.1;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--ink);
  margin: .5rem 0 .3rem;
}
.rrss-carousel-slide.cta h6 { color: var(--bg); }
.rrss-carousel-slide p {
  font-size: 0.72rem; line-height: 1.45;
  color: var(--ink-soft);
}
.rrss-carousel-slide.cta p { color: var(--bg); opacity: .85; }

/* RRSS · reel cover mockup */
.rrss-reel-cover {
  aspect-ratio: 9 / 16;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  border: 2px solid var(--line);
  background-size: cover; background-position: center;
  max-width: 180px;
  width: 100%;
}
.rrss-reel-cover::after {
  content: '▶';
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.35);
  color: #fff;
  font-size: 2.4rem;
  text-shadow: 0 2px 12px rgba(0,0,0,0.5);
}

/* DIGITALS · TELECTRONIC PATTERN */
.tel-kpis {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  background: linear-gradient(135deg, var(--bg2), var(--bg));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 1.6rem;
  margin-bottom: 1.6rem;
  position: relative;
  overflow: hidden;
}
@media (max-width: 900px) { .tel-kpis { grid-template-columns: repeat(2, 1fr); } }
.tel-kpis::before {
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 36px 36px;
  mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 80% at 50% 50%, black 30%, transparent 75%);
}
.tel-kpi {
  position: relative; z-index: 2;
  text-align: left;
  padding: .4rem .2rem;
}
.tel-kpi .suf {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: .5rem;
  font-weight: 700;
}
.tel-kpi .num {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(2rem, 4vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--ink);
  background: linear-gradient(180deg, var(--ink), rgba(244,236,220,0.45));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.tel-kpi .lbl {
  font-size: 0.78rem;
  color: var(--ink-soft);
  margin-top: .4rem;
  line-height: 1.3;
}

.tel-pillars {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; margin-bottom: 1.6rem;
}
@media (max-width: 900px) { .tel-pillars { grid-template-columns: 1fr; } }
.tel-pillar {
  position: relative;
  padding: 1.4rem 1.4rem;
  border: 1px solid var(--pillar-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(180deg, var(--pillar-bg, rgba(255,90,31,0.06)), transparent);
  overflow: hidden;
}
.tel-pillar::before {
  content: ''; position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--pillar-glow, rgba(255,90,31,0.25)), transparent 70%);
  opacity: .35;
}
.tel-pillar .ico {
  width: 38px; height: 38px;
  border-radius: 8px;
  background: var(--pillar-color, var(--accent));
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: .8rem;
  position: relative; z-index: 2;
  color: var(--bg);
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 1rem;
}
.tel-pillar .kicker {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.2em;
  color: var(--pillar-color, var(--accent));
  text-transform: uppercase;
  margin-bottom: .35rem;
  display: block;
}
.tel-pillar h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .5rem;
  position: relative; z-index: 2;
}
.tel-pillar p {
  font-size: 0.85rem; line-height: 1.6;
  color: var(--ink-soft);
  position: relative; z-index: 2;
}
.tel-pillar p em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--ink);
}

/* The squad team grid */
.tel-squad-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin: 1.8rem 0 1rem;
  flex-wrap: wrap; gap: 1rem;
}
.tel-squad-head .kicker {
  display: block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: .35rem;
}
.tel-squad-head h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  color: var(--ink);
  text-transform: uppercase;
  margin: 0;
  line-height: 1.05;
}
.tel-squad-head h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  text-transform: none;
  color: var(--accent);
}
.tel-squad-head .right {
  font-size: 0.72rem;
  color: var(--ink-soft);
  text-align: right;
  line-height: 1.5;
}

.tel-team-grid {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 1.6rem;
}
@media (max-width: 1100px) { .tel-team-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 700px)  { .tel-team-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 480px)  { .tel-team-grid { grid-template-columns: repeat(2, 1fr); } }
.tel-team-card {
  position: relative;
  aspect-ratio: 3/4;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg2);
  border: 1px solid var(--line);
  transition: transform .35s ease, box-shadow .35s ease, border-color .3s;
}
.tel-team-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 20px 40px rgba(255,90,31,0.20);
  border-color: var(--accent);
}
.tel-team-card img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center 18%;
  filter: grayscale(100%);
  transition: filter .4s ease;
  display: block;
}
.tel-team-card:hover img { filter: grayscale(0%); }
.tel-team-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.85) 100%);
  pointer-events: none;
}
.tel-team-card .tm-meta {
  position: absolute; bottom: 8px; left: 10px; right: 10px;
  z-index: 2;
}
.tel-team-card .tm-name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.92rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: #fff;
  line-height: 1;
}
.tel-team-card .tm-role {
  font-size: 0.55rem;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
  margin-top: 4px;
  font-weight: 700;
}

/* Partnerships */
.tel-partners {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 1.4rem;
}
@media (max-width: 900px) { .tel-partners { grid-template-columns: repeat(2, 1fr); } }
.tel-partner {
  text-align: center;
  padding: 1.4rem 1.2rem;
  border: 1px solid var(--p-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(180deg, var(--p-bg, rgba(255,255,255,0.04)), transparent 60%);
  transition: transform .3s, box-shadow .3s;
}
.tel-partner:hover { transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0,0,0,0.35); }
.tel-partner .name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--p-color, var(--accent));
  letter-spacing: -0.025em;
  line-height: 1;
}
.tel-partner .tag {
  font-size: 0.58rem; letter-spacing: 0.18em;
  color: var(--ink);
  text-transform: uppercase;
  margin-top: .55rem;
  font-weight: 800;
}
.tel-partner .detail {
  font-size: 0.74rem; line-height: 1.45;
  color: var(--ink-soft);
  margin-top: .6rem;
}

/* Why client callout */
.tel-why-callout {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--accent);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,90,31,0.06), transparent 80%);
}
.tel-why-callout h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .8rem;
}
.tel-why-callout h4 .accent-orange { color: var(--accent); font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; text-transform: none; }
.tel-why-callout p {
  font-size: 0.92rem; line-height: 1.7;
  color: var(--ink-soft);
}
.tel-why-callout p b { color: var(--ink); font-weight: 500; }
.tel-why-callout p em { font-style: italic; color: var(--accent); }

/* Cofounders */
.cof-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1.4rem;
}
@media (max-width: 800px) { .cof-grid { grid-template-columns: 1fr; } }
.cof-card {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--cof-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(180deg, var(--cof-bg, rgba(255,90,31,0.04)), transparent);
}
.cof-card .kicker {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.22em;
  color: var(--cof-color, var(--accent));
  text-transform: uppercase;
  margin-bottom: .35rem;
  display: block;
}
.cof-card h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 1.3rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}
.cof-card ul {
  list-style: none;
  display: flex; flex-direction: column; gap: .55rem;
}
.cof-card ul li {
  font-size: 0.85rem; line-height: 1.5;
  color: var(--ink-soft);
  padding-left: 1.2rem;
  position: relative;
}
.cof-card ul li::before {
  content: '◦'; position: absolute; left: 0;
  color: var(--cof-color, var(--accent));
  font-weight: 600;
}
.cof-card ul li b { color: var(--ink); font-weight: 600; }

/* Stack section */
.stack-hito {
  margin-bottom: 1.6rem;
  padding: 1.4rem 1.5rem;
  border: 1px solid #FF0050;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,0,80,0.10), transparent 80%);
}
.stack-hito .head {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: .6rem;
  flex-wrap: wrap;
}
.stack-hito .badge {
  background: #FF0050;
  color: #fff;
  padding: .3rem .7rem;
  border-radius: 999px;
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  font-weight: 700;
}
.stack-hito h4 {
  margin: 0;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.25rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
}
.stack-hito h4 .hi { color: #FF0050; }
.stack-hito p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
}
.stack-hito p b { color: var(--ink); font-weight: 500; }
.stack-hito p em { color: var(--accent); font-style: italic; }

.stack-list {
  display: flex; flex-direction: column;
  gap: 14px;
}
.stack-row {
  padding: 1.4rem 1.4rem;
  border: 1px solid var(--stack-color, var(--accent));
  border-radius: 12px;
  background: linear-gradient(135deg, var(--stack-bg, rgba(255,90,31,0.06)), transparent 60%);
  position: relative; overflow: hidden;
}
.stack-row::before {
  content: ''; position: absolute;
  top: -40px; right: -40px;
  width: 160px; height: 160px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--stack-glow, rgba(255,90,31,0.25)), transparent 70%);
  opacity: .35;
  pointer-events: none;
}
.stack-row .row-inner {
  display: grid; grid-template-columns: 1fr 2fr;
  gap: 24px;
  align-items: flex-start;
  position: relative; z-index: 2;
}
@media (max-width: 800px) { .stack-row .row-inner { grid-template-columns: 1fr; } }
.stack-row .row-meta .tag {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.22em;
  color: var(--stack-color, var(--accent));
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: .5rem;
  display: inline-block;
  padding: .2rem .6rem;
  background: rgba(11,10,8,0.55);
  border-radius: 999px;
  border: 1px solid var(--stack-color, var(--accent));
}
.stack-row .row-meta h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  color: var(--ink);
  margin-bottom: .5rem;
}
.stack-row .row-meta p {
  font-size: 0.84rem; line-height: 1.6;
  color: var(--ink-soft);
}
.stack-row .row-items {
  display: flex; flex-direction: column; gap: 8px;
}
.stack-row .row-item {
  padding: .7rem .9rem;
  background: rgba(11,10,8,0.55);
  border-radius: 8px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--stack-color, var(--accent));
}
.stack-row .row-item .nm {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--ink);
  margin-bottom: .2rem;
}
.stack-row .row-item .use {
  font-size: 0.78rem; line-height: 1.45;
  color: var(--ink-soft);
}

/* ====================================
   WEB BODY EXTRAS · gallery / quotes / FAQ / forms / partners
   ==================================== */
.web-gallery {
  display: grid; grid-template-columns: 2fr 1fr 1fr;
  grid-template-rows: 280px 280px;
  gap: .5rem;
  margin-top: 1rem;
}
@media (max-width: 900px) { .web-gallery { grid-template-columns: 1fr 1fr; grid-template-rows: 200px 200px 200px; } }
@media (max-width: 600px) { .web-gallery { grid-template-columns: 1fr; grid-template-rows: 200px repeat(5, 160px); } }
.web-gallery > div {
  background-size: cover; background-position: center;
  border-radius: 12px;
  border: 1px solid var(--style-line);
  position: relative;
  overflow: hidden;
  transition: transform .3s;
}
.web-gallery > div:hover { transform: scale(1.02); }
.web-gallery > div::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.55) 100%);
  pointer-events: none;
}
.web-gallery .g-label {
  position: absolute; bottom: 1rem; left: 1rem; right: 1rem;
  z-index: 2;
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: #fff;
  text-transform: uppercase;
}
.web-gallery .g-label b {
  display: block;
  font-family: var(--style-display), sans-serif;
  font-weight: 700; font-size: 0.95rem;
  margin-top: .25rem;
  letter-spacing: -0.005em;
  text-transform: uppercase;
}
.web-gallery .g1 { grid-row: span 2; }

/* Testimonios / quotes */
.web-quotes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 1rem; }
@media (max-width: 900px) { .web-quotes { grid-template-columns: 1fr; } }
.web-quote {
  padding: 1.6rem 1.5rem;
  border: 1px solid var(--style-line);
  border-radius: 14px;
  background: var(--style-bg2);
  display: flex; flex-direction: column; gap: 1rem;
}
.web-quote .qm {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 4rem; line-height: .3;
  color: var(--style-accent);
  margin-bottom: 0;
}
.web-quote .text {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 1.05rem; line-height: 1.5;
  color: var(--style-ink);
  flex: 1;
}
.web-quote .author {
  display: grid; grid-template-columns: 40px 1fr;
  gap: .8rem; align-items: center;
  padding-top: 1rem;
  border-top: 1px dashed var(--style-line);
}
.web-quote .author .av {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--style-accent);
  color: var(--style-bg);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--style-display), sans-serif;
  font-weight: 800;
  font-size: 1rem;
}
.web-quote .author .info b {
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 0.88rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  display: block;
}
.web-quote .author .info span {
  font-size: 0.72rem; color: var(--style-soft);
  letter-spacing: 0.04em;
}

/* FAQ accordion */
.web-faq { display: flex; flex-direction: column; gap: .55rem; margin-top: 1rem; }
.web-faq-item {
  padding: 1.1rem 1.4rem;
  border: 1px solid var(--style-line);
  border-radius: 10px;
  background: var(--style-bg2);
  transition: border-color .25s;
}
.web-faq-item:hover { border-color: var(--style-accent); }
.web-faq-item .q {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 1rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  cursor: pointer;
}
.web-faq-item .q .plus {
  font-family: var(--style-display), sans-serif;
  font-weight: 400;
  font-size: 1.6rem;
  color: var(--style-accent);
  line-height: 1;
}
.web-faq-item .a {
  margin-top: .8rem;
  padding-top: .8rem;
  border-top: 1px dashed var(--style-line);
  font-family: var(--style-body), sans-serif;
  font-size: 0.88rem; line-height: 1.65;
  color: var(--style-soft);
}

/* Form mockup · contact / cotizar */
.web-form-mock {
  padding: 2rem 1.8rem;
  border: 1px solid var(--style-line);
  border-radius: 14px;
  background: var(--style-bg2);
  display: grid; grid-template-columns: 1fr 1.2fr;
  gap: 2rem; align-items: flex-start;
}
@media (max-width: 900px) { .web-form-mock { grid-template-columns: 1fr; } }
.web-form-mock .meta h4 {
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.015em;
  line-height: 1.1;
  margin-bottom: .8rem;
}
.web-form-mock .meta h4 em {
  font-family: var(--style-italic), serif;
  font-style: italic;
  color: var(--style-accent);
  font-weight: 400;
  text-transform: none;
}
.web-form-mock .meta p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--style-soft);
  margin-bottom: 1.2rem;
}
.web-form-mock .meta .checklist {
  list-style: none;
  display: flex; flex-direction: column; gap: .45rem;
}
.web-form-mock .meta .checklist li {
  font-size: 0.84rem; line-height: 1.5;
  color: var(--style-ink);
  padding-left: 1.4rem;
  position: relative;
}
.web-form-mock .meta .checklist li::before {
  content: '✓'; position: absolute; left: 0; top: 0;
  color: var(--style-accent);
  font-weight: 700;
}
.web-form-mock .fields { display: flex; flex-direction: column; gap: .55rem; }
.web-form-mock .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; }
.web-form-mock .field-row.full { grid-template-columns: 1fr; }
.web-form-mock .field {
  padding: .9rem 1rem;
  background: var(--style-bg);
  border: 1px solid var(--style-line);
  border-radius: 8px;

.pop-sticker.s2 { background: var(--style-accent2); color: #0E0A06; }

/* Partners grid (verde) */
.verde-partners { display: grid; grid-template-columns: repeat(4, 1fr); gap: .55rem; }

/* ====================================
   COMM STRATEGY DEEP
   ==================================== */

}

.persona-card {

/* Customer Journey */

  padding: .9rem 1rem;

}

.cal-sampler .cal-cell .pillar-tag.p2 { background: rgba(201,242,92,0.15); color: var(--accent2); }
.cal-sampler .cal-cell .pillar-tag.p3 { background: rgba(242,193,43,0.15); color: var(--accent3); }
.cal-sampler .cal-cell .pillar-tag.p4 { background: rgba(255,31,107,0.15); color: #FF1F6B; }
.cal-sampler .cal-cell b {
  display: block;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 0.78rem;

  letter-spacing: -0.005em;
  margin-top: .15rem;
}

   ==================================== */

.showcase-cluster-head h3 {
  font-family: 'Bricolage Grotesque', sans-serif;

}
.showcase-cluster-head h3 em {

.showcase-cluster-head .count {

.showcase-grid {

}
@media (max-width: 1100px) { .showcase-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 700px)  { .showcase-grid { grid-template-columns: repeat(2, 1fr); } }
.showcase-tile {
  aspect-ratio: var(--tile-ratio, 1 / 1);

.showcase-videos {

  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.16em;
  color: #fff;
  text-transform: uppercase;

.showcase-video .vmeta b {
  display: block;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: -0.005em;
  text-transform: uppercase;

}

function RrssSection({ propId }) {
  const p = T.rrssProps.find(r => r.id === propId);
  if (!p) return null;
  const linkedStyle = T.webStyles.find(w => w.idx === p.linkedWeb);
  const accent = linkedStyle ? linkedStyle.palette.accent : '#FF5A1F';
  const accent2 = linkedStyle ? linkedStyle.palette.accent2 : '#9E8266';
  const displayFam = linkedStyle ? linkedStyle.typo.display.family : 'Bricolage Grotesque';
  const cssVars = {

/* ========================================================
   APP
   ======================================================== */
function App() {
  const [section, setSection] = useState('summary');
  const [mobileNav, setMobileNav] = useState(false);

  // Cursor trail
  useEffect(() => {
    if (window.matchMedia('(hover: none)').matches) return;
    const t = document.createElement('div');
    t.className = 'cursor-trail';
    document.body.appendChild(t);
    const onMove = (e) => {
      t.style.left = e.clientX + 'px';
      t.style.top = e.clientY + 'px';
    };
    document.addEventListener('mousemove', onMove);
    return () => {
      document.removeEventListener('mousemove', onMove);
      t.remove();
    };
  }, []);

  // Tilt effect on .tilt elements
  useEffect(() => {
    const tm = setTimeout(() => {
      const cards = document.querySelectorAll('.tilt');
      cards.forEach(card => {
        if (card.__tiltInit) return;
        card.__tiltInit = true;
        let raf = null;
        let rx = 0, ry = 0, tx = 0, ty = 0;
        const glare = document.createElement('div');
        glare.style.cssText = 'position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%, rgba(244,236,220,0.10), transparent 50%);opacity:0;mix-blend-mode:screen;border-radius:inherit;transition:opacity .25s';
        if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
        card.appendChild(glare);
        const apply = () => {
          card.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translate3d(${tx.toFixed(1)}px,${ty.toFixed(1)}px,0)`;
          raf = null;
        };
        const onEnter = () => { glare.style.opacity = '1'; };
        const onMove = (e) => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width - 0.5;
          const y = (e.clientY - r.top) / r.height - 0.5;
          rx = -y * 10; ry = x * 14; tx = x * 5; ty = y * 5;
          glare.style.background = `radial-gradient(circle at ${(x+0.5)*100}% ${(y+0.5)*100}%, rgba(255,90,31,0.18), transparent 55%)`;
          if (!raf) raf = requestAnimationFrame(apply);
        };
        const onLeave = () => {
          rx = 0; ry = 0; tx = 0; ty = 0;
          glare.style.opacity = '0';
          if (raf) cancelAnimationFrame(raf);
          card.style.transition = 'transform .55s cubic-bezier(.2,.8,.2,1)';
          requestAnimationFrame(apply);
          setTimeout(() => { card.style.transition = ''; }, 600);
        };
        card.addEventListener('mouseenter', onEnter);
        card.addEventListener('mousemove', onMove);
        card.addEventListener('mouseleave', onLeave);
        card.style.willChange = 'transform';
        card.style.transformStyle = 'preserve-3d';
      });
    }, 80);
    return () => clearTimeout(tm);
  }, [section]);

  function renderSection() {
    switch (section) {
      case 'summary':    return <SummarySection/>;
      case 'brief':      return <BriefSection/>;
      case 'audit':      return <AuditSection/>;
      case 'logo':       return <LogoSection/>;
      case 'market':     return <MarketSection/>;
      case 'insights':   return <InsightsSection/>;
      case 'comm':       return <CommSection/>;
      case 'pillars':    return <PillarsSection/>;
      case 'graphic':    return <GraphicSection/>;
      case 'tini':       return <TiniSection/>;
      case 'funnel':     return <FunnelSection/>;
      case 'google':     return <GoogleSection/>;
      case 'meta':       return <MetaSection/>;
      case 'webmother':  return <MotherWebSection/>;
      case 'styles-ovr': return <StylesOverviewSection setSection={setSection}/>;
      case 'web-taller': return <WebStyleSection styleId="taller"/>;
      case 'web-pop':    return <WebStyleSection styleId="pop"/>;
      case 'web-verde':  return <WebStyleSection styleId="verde"/>;
      case 'web-digitalscut': return <DigitalsCutSection/>;
      case 'rrss-taller':return <RrssSection propId="rrss-taller"/>;
      case 'rrss-pop':   return <RrssSection propId="rrss-pop"/>;
      case 'rrss-verde': return <RrssSection propId="rrss-verde"/>;
      case 'rrss-tryon': return <RrssTryOnSection/>;
      case 'land-estamp':return <LandEstampadoSection/>;
      case 'land-merch': return <LandMerchSection/>;
      case 'land-widget':return <LandMerchWidgetSection/>;
      case 'showcase':       return <ShowcaseSection/>;
      case 'digitals-about': return <DigitalsAboutSection/>;
      case 'digitals-team':  return <DigitalsTeamSection/>;
      case 'digitals-stack': return <DigitalsStackSection/>;
      case 'roadmap':    return <RoadmapSection/>;
      case 'gantt':      return <GanttSection/>;
      case 'ownership':  return <OwnershipSection/>;
      case 'operating':  return <OperatingSection/>;
      default:           return <SummarySection/>;
    }
  }

  return (
    <>
      <button className={'shell-burger ' + (mobileNav ? 'open' : '')} onClick={() => setMobileNav(!mobileNav)} aria-label="Menú">
        <span/><span/><span/>
      </button>
      <div className={'shell-backdrop ' + (mobileNav ? 'show' : '')} onClick={() => setMobileNav(false)}/>
      <div className={'shell-sidebar-wrap ' + (mobileNav ? 'open' : '')}>
        <Sidebar section={section} setSection={setSection} onClickItem={() => setMobileNav(false)}/>
      </div>
      <div className="content">{renderSection()}</div>
    </>
  );
}
