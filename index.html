<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Estampa Textil · Propuesta 2026 · Digitals</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Instrument+Serif:ital,wght@0,400;1,400&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Archivo+Black&family=Caprasimo&family=Manrope:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script>
  (function(){ try { var s = localStorage.getItem('let-theme'); if (!s) s = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; if (s === 'light') document.documentElement.setAttribute('data-theme','light'); } catch(e){} })();
</script>

<style>
:root {
  --bg: #0B0A08;
  --bg2: #15140F;
  --bg3: #1c1a14;
  --ink: #F4ECDC;
  --ink-soft: #94897A;
  --line: rgba(244,236,220,0.08);
  --line-strong: rgba(244,236,220,0.18);
  --accent: #FF5A1F;          /* DTF orange */
  --accent-deep: #B53A0F;
  --accent2: #C9F25C;         /* eco lime */
  --accent3: #F2C12B;         /* hilo dorado */
  --accent-current: #FF5A1F;
  color-scheme: dark;
}

/* === LIGHT MODE ===
   Mantiene tipografía + acentos (DTF orange, lime, dorado, 3 olas)
   Invierte solo neutrals: papel manteca/crudo como bg, tinta charcoal como ink
*/
[data-theme="light"] {
  --bg:           #FAF6EE;   /* papel manteca crudo */
  --bg2:          #F2EBDD;   /* crudo profundo */
  --bg3:          #E8DEC8;   /* crudo cálido */
  --ink:          #1A1814;   /* tinta charcoal */
  --ink-soft:     #5A574E;
  --line:         rgba(26,24,20,0.10);
  --line-strong:  rgba(26,24,20,0.20);
  --accent:       #D84B0F;   /* DTF orange ligeramente más profundo para contraste */
  --accent-deep:  #9A2F08;
  color-scheme: light;
}
[data-theme="light"] body { background: var(--bg); color: var(--ink); }
[data-theme="light"] ::selection { background: var(--accent); color: #FAF6EE; }
[data-theme="light"] .sidebar { background: linear-gradient(180deg, #F4ECDC 0%, var(--bg) 100%); border-right-color: var(--line); }
[data-theme="light"] .sidebar::before { opacity: .85; }
[data-theme="light"] img[src*="digitals-agencia"]:not([src*="-dark"]) { filter: invert(1) hue-rotate(180deg); }
[data-theme="light"] [style*="background:#0B0A08"], [data-theme="light"] [style*="background: #0B0A08"], [data-theme="light"] [style*="background:#15140F"], [data-theme="light"] [style*="background: #15140F"] { background-color: var(--bg2) !important; color: var(--ink) !important; }
[data-theme="light"] [style*="color:#F4ECDC"], [data-theme="light"] [style*="color: #F4ECDC"] { color: var(--ink) !important; }
body, .sidebar, .nav-link, .group, [class*="card"], [class*="panel"], section { transition: background-color 0.45s ease, color 0.45s ease, border-color 0.45s ease, filter 0.45s ease; }

/* === THEME TOGGLE BUTTON === */
.theme-toggle-pill {
  display: inline-flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 10px 14px;
  margin-top: 4px;
  background: var(--bg2);
  border: 1px solid var(--line-strong);
  border-radius: 100px;
  color: var(--ink);
  font-family: 'Geist Mono', 'Geist', monospace;
  font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
  position: relative;
  outline: none;
}
.theme-toggle-pill:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.theme-toggle-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-toggle-track {
  width: 32px; height: 18px;
  background: rgba(244,236,220,0.10);
  border: 1px solid var(--line-strong);
  border-radius: 100px;
  position: relative;
  flex-shrink: 0;
  transition: background 0.3s;
}
[data-theme="light"] .theme-toggle-track { background: rgba(26,24,20,0.10); }
.theme-toggle-thumb {
  position: absolute; top: 1px; left: 1px;
  width: 14px; height: 14px;
  background: var(--accent);
  border-radius: 50%;
  transition: transform 0.35s cubic-bezier(0.22,1,0.36,1), background 0.3s;
  display: grid; place-items: center;
  color: #fff;
}
.theme-toggle-thumb svg { width: 10px; height: 10px; }
[data-theme="light"] .theme-toggle-thumb { transform: translateX(14px); background: var(--accent3); }
.theme-toggle-label { flex: 1; text-align: left; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--ink);
  font-family: 'Geist', 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body { min-height: 100vh; }
::selection { background: var(--accent); color: #0B0A08; }

a { color: inherit; text-decoration: none; }

#app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
@media (max-width: 1100px) { #app { grid-template-columns: 1fr; } }

/* ====================================
   SIDEBAR
   ==================================== */
.sidebar {
  position: sticky; top: 0; height: 100vh;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, #0e0d0a 0%, var(--bg) 100%);
  padding: 1.8rem 1.2rem 1.2rem;
  display: flex; flex-direction: column; gap: 1.6rem;
  overflow-y: auto;
  position: relative;
}
.sidebar::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--accent) 0%, transparent 55%, var(--accent2) 100%);
  opacity: .6;
}
.digitals-mark {
  display: flex; flex-direction: column; gap: .9rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid var(--line);
}
.digitals-mark .logo-wrap img {
  height: 52px; width: auto; max-width: 220px;
  display: block; object-fit: contain;
}
.digitals-mark .role {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--accent);
  display: inline-flex; align-items: center; gap: .55rem;
}
.digitals-mark .role::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent);
  animation: dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse { 50% { opacity: .35; } }

.doc-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.78rem; line-height: 1.02; letter-spacing: -0.01em;
  color: var(--ink);
  text-transform: uppercase;
}
.doc-title em {
  font-family: 'Instrument Serif', serif;
  font-style: italic; font-weight: 400;
  color: var(--accent);
  text-transform: none;
  letter-spacing: 0;
  font-size: 1.55rem;
}
.doc-meta {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: var(--ink-soft); text-transform: uppercase;
  display: flex; align-items: center; gap: .45rem;
  margin-top: .55rem;
}
.doc-meta i { width: 4px; height: 4px; border-radius: 50%; background: var(--ink-soft); }

.group { display: flex; flex-direction: column; gap: .1rem; }
.group h5 {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.22em;
  color: var(--ink-soft); text-transform: uppercase;
  margin-bottom: .4rem;
  padding: .45rem .8rem;
  display: flex; align-items: center; gap: .5rem;
}
.group h5::before { content: ''; width: 12px; height: 1px; background: var(--accent); }

.nav-link {
  display: flex; align-items: center; gap: .8rem;
  padding: .55rem .8rem;
  font-family: 'Geist', sans-serif;
  font-size: 0.82rem; color: var(--ink-soft);
  border-left: 2px solid transparent;
  cursor: pointer;
  transition: all .22s;
}
.nav-link:hover {
  color: var(--ink);
  background: rgba(255,90,31,0.06);
  border-left-color: var(--accent);
}
.nav-link.active {
  color: var(--ink);
  background: rgba(255,90,31,0.10);
  border-left-color: var(--accent);
}
.nav-link .num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.1em;
  opacity: .6; min-width: 30px;
}
.nav-link .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-current, var(--accent));
  margin-left: auto;
}

/* ====================================
   CONTENT
   ==================================== */
.content {
  padding: 2rem 2.5rem 5rem;
  max-width: 100%;
  overflow-x: hidden;
}
@media (max-width: 700px) { .content { padding: 1.4rem 1.2rem 4rem; } }

/* MOBILE BURGER */
.shell-burger {
  display: none;
  position: fixed; top: 1rem; right: 1rem; z-index: 50;
  width: 44px; height: 44px;
  background: var(--bg2); border: 1px solid var(--line);
  border-radius: 10px; cursor: pointer;
  flex-direction: column; gap: 5px;
  align-items: center; justify-content: center;
}
.shell-burger span { display: block; width: 18px; height: 2px; background: var(--ink); transition: all .25s; }
.shell-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.shell-burger.open span:nth-child(2) { opacity: 0; }
.shell-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
.shell-backdrop {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.55); z-index: 30;
  opacity: 0; transition: opacity .25s;
}
.shell-backdrop.show { opacity: 1; }
.shell-sidebar-wrap { display: contents; }

@media (max-width: 1100px) {
  .shell-burger { display: flex; }
  .shell-sidebar-wrap {
    display: block;
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 290px; max-width: 80vw; z-index: 40;
    transform: translateX(-100%); transition: transform .3s ease;
  }
  .shell-sidebar-wrap.open { transform: translateX(0); }
  .shell-sidebar-wrap.open + .shell-backdrop,
  .shell-backdrop.show { display: block; }
  .sidebar { height: 100vh; }
}

/* ====================================
   SECTION HEAD
   ==================================== */
.section-head {
  display: grid; grid-template-columns: 80px 1fr 320px;
  gap: 2rem; align-items: start;
  padding: 2rem 0 2.5rem;
  margin-bottom: 1.5rem;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.section-head::before {
  content: ''; position: absolute; bottom: -1px; left: 0;
  width: 80px; height: 2px;
  background: var(--accent);
}
@media (max-width: 900px) {
  .section-head { grid-template-columns: 1fr; gap: 1rem; }
}
.section-head .num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.18em;
  color: var(--ink-soft);
  padding-top: .8rem;
}
.section-head h2 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: clamp(1.85rem, 4.4vw, 3.4rem);
  line-height: .98; letter-spacing: -0.02em;
  color: var(--ink);
  text-transform: uppercase;
}
.section-head h2 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic; font-weight: 400;
  color: var(--accent);
  text-transform: none;
  letter-spacing: 0;
}
.section-head .right {
  font-size: 0.9rem; line-height: 1.55;
  color: var(--ink-soft);
  max-width: 360px;
  padding-top: 1rem;
}

/* ====================================
   SUMMARY HERO
   ==================================== */
.summary-hero {
  padding: 2.5rem 0 4rem;
  border-bottom: 1px solid var(--line);
  position: relative;
}
.summary-hero::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
}
.summary-kicker {
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.22em;
  color: var(--accent);
  text-transform: uppercase;
  padding: .5rem 1rem;
  border: 1px solid var(--line);
  border-radius: 100px;
  margin-bottom: 1.8rem;
}
.summary-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: clamp(2.2rem, 5.2vw, 4.6rem);
  line-height: 1; letter-spacing: -0.02em;
  color: var(--ink);
  margin: 0 0 1.5rem;
  max-width: 1100px;
  text-transform: uppercase;
}
.summary-title em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
}
.summary-lead {
  font-family: 'Geist', sans-serif;
  font-size: 1.02rem; line-height: 1.7;
  color: var(--ink-soft);
  max-width: 760px;
}
.summary-lead b { color: var(--ink); font-weight: 500; }

.fact-row {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: .8rem;
  margin-top: 2.5rem;
}
@media (max-width: 1100px) { .fact-row { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px)  { .fact-row { grid-template-columns: repeat(2, 1fr); } }
.fact {
  padding: 1rem .9rem;
  border: 1px solid var(--line);
  background: var(--bg2);
  border-radius: 8px;
}
.fact .k {
  display: block;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.fact .v {
  display: block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem;
  color: var(--ink-soft);
  margin-top: .25rem;
  letter-spacing: 0.08em;
  line-height: 1.5;
}

/* ====================================
   PILLARS / SUMMARY CARDS
   ==================================== */
.pillars-row {
  margin-top: 4rem;
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1.2rem;
}
@media (max-width: 900px) { .pillars-row { grid-template-columns: 1fr; } }
.pillar-block {
  position: relative;
  padding: 1.8rem 1.5rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(180deg, rgba(255,90,31,0.025), transparent);
  transition: border-color .25s, box-shadow .25s;
}
.pillar-block:hover {
  border-color: var(--accent);
  box-shadow: 0 18px 42px -14px rgba(255,90,31,0.22);
}
.pillar-block .num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.2em;
  color: var(--accent);
  background: rgba(255,90,31,0.10);
  padding: .35rem .6rem; border-radius: 4px;
}
.pillar-block h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.55rem; letter-spacing: -0.01em;
  margin: 1rem 0 .8rem;
  color: var(--ink);
  text-transform: uppercase;
  line-height: 1.05;
}
.pillar-block h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
  text-transform: none;
}
.pillar-block p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
  margin-bottom: 1rem;
}
.pillar-block ul {
  list-style: none;
  display: flex; flex-direction: column; gap: .5rem;
  padding-top: .8rem;
  border-top: 1px dashed var(--line);
}
.pillar-block ul li {
  font-size: 0.85rem; line-height: 1.5;
  color: var(--ink-soft);
  padding-left: 1.2rem; position: relative;
}
.pillar-block ul li::before {
  content: '→'; position: absolute; left: 0;
  color: var(--accent);
}
.pillar-block ul li b { color: var(--ink); font-weight: 500; }

/* ====================================
   MARKET TABLE
   ==================================== */
.market-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg2);
}
.market-table {
  width: 100%; border-collapse: collapse;
  font-family: 'Geist', sans-serif;
  font-size: 0.84rem;
  min-width: 720px;
}
.market-table th {
  padding: .9rem 1rem; text-align: left;
  background: rgba(0,0,0,0.3);
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.16em;
  color: var(--ink-soft); text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.market-table td {
  padding: .9rem 1rem; color: var(--ink-soft);
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.market-table td b { color: var(--ink); font-weight: 500; }
.market-table tr:last-child td { border-bottom: 0; }
.market-table tr.us td { background: rgba(255,90,31,0.07); color: var(--ink); }
.market-table tr.us td b { color: var(--accent); }
.score {
  font-family: 'Geist Mono', monospace;
  font-weight: 600; font-size: 0.7rem;
  padding: .25rem .55rem; border-radius: 100px;
  display: inline-block;
}
.score.s4 { background: rgba(255,90,60,0.10); color: #ff8a6a; }
.score.s5 { background: rgba(255,140,60,0.12); color: #ffa46a; }
.score.s6 { background: rgba(255,170,60,0.14); color: #ffba70; }
.score.s7 { background: rgba(255,193,43,0.14); color: var(--accent3); }
.score.s9 { background: rgba(201,242,92,0.16); color: var(--accent2); }
.bench-type {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.14em;
  font-weight: 600;
  padding: .2rem .5rem; border-radius: 100px;
  text-transform: uppercase;
  display: inline-block;
}
.bench-type.directo  { background: rgba(255,140,90,0.14); color: #ff8a6a; }
.bench-type.indirecto{ background: rgba(242,193,43,0.16); color: var(--accent3); }
.bench-type.b2bcl    { background: rgba(242,193,43,0.16); color: var(--accent3); }
.bench-type.global   { background: rgba(180,140,255,0.14); color: #c5a2ff; }
.bench-type.referente{ background: rgba(201,242,92,0.16); color: var(--accent2); }
.bench-type.us       { background: rgba(255,90,31,0.18); color: var(--accent); }

.lead-callout {
  margin-top: 1.4rem;
  padding: 1.2rem 1.4rem;
  border: 1px solid var(--line);
  background: var(--bg2);
  border-radius: 8px;
  font-family: 'Geist', sans-serif;
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
}
.lead-callout b { color: var(--ink); font-weight: 500; }
.lead-callout .hl { color: var(--accent); font-weight: 500; }

/* ====================================
   INSIGHTS
   ==================================== */
.insights-list {
  display: flex; flex-direction: column; gap: 1rem;
}
.insight-card {
  display: grid; grid-template-columns: 1.5fr 2.5fr;
  gap: 2rem;
  padding: 2rem 1.6rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg2);
  transition: border-color .25s, box-shadow .25s;
  position: relative;
}
@media (max-width: 900px) {
  .insight-card { grid-template-columns: 1fr; gap: 1rem; }
}
.insight-card:hover { border-color: var(--accent); box-shadow: 0 22px 50px -16px rgba(255,90,31,0.20); }
.insight-card .left .kicker {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: var(--accent);
  background: rgba(255,90,31,0.12);
  padding: .35rem .65rem; border-radius: 4px;
  text-transform: uppercase;
  display: inline-block; margin-bottom: 1rem;
}
.insight-card .left h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.7rem; line-height: 1.1; letter-spacing: -0.015em;
  color: var(--ink);
  text-transform: uppercase;
}
.insight-card .left h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
  text-transform: none;
}
.insight-card .right p {
  font-size: 1rem; line-height: 1.7;
  color: var(--ink-soft);
  margin-bottom: 1.2rem;
}
.insight-card .right .use {
  border-top: 1px dashed var(--line);
  padding-top: .9rem;
  font-size: 0.88rem;
  line-height: 1.6;
  color: var(--ink);
}
.insight-card .right .use b {
  color: var(--accent);
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  display: block;
  margin-bottom: .35rem;
}

/* ====================================
   PALETTE / GRAPHIC
   ==================================== */
.palette-block {
  padding: 2.4rem 2rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg2);
}
.palette-row {
  display: flex; gap: .6rem; margin: 1.5rem 0 .8rem;
  flex-wrap: wrap;
}
.palette-swatch {
  flex: 1; min-width: 100px;
  padding: 1.4rem 1rem;
  border-radius: 8px;
  display: flex; flex-direction: column; gap: .4rem;
  border: 1px solid var(--line);
  position: relative;
  min-height: 110px;
}
.palette-swatch .lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
}
.palette-swatch .hex {
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem;
  opacity: .8;
  margin-top: auto;
}

.types-row {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 1rem; margin-top: 1.5rem;
}
@media (max-width: 700px) { .types-row { grid-template-columns: 1fr; } }
.type-card {
  padding: 1.6rem 1.4rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(244,236,220,0.02);
}
.type-card .role {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.2em;
  color: var(--accent);
  text-transform: uppercase;
}
.type-card .preview {
  margin: .9rem 0 .5rem;
  font-size: 2rem; line-height: 1.1;
  color: var(--ink);
  letter-spacing: -0.01em;
}
.type-card .meta {
  font-family: 'Geist Mono', monospace;
  font-size: 0.66rem;
  color: var(--ink-soft);
  letter-spacing: 0.05em;
}
.type-card .preview.display   { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; text-transform: uppercase; }
.type-card .preview.editorial { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
.type-card .preview.body      { font-family: 'Geist', sans-serif; font-weight: 500; font-size: 1.4rem; }
.type-card .preview.mono      { font-family: 'Geist Mono', monospace; font-weight: 500; font-size: 1.3rem; letter-spacing: 0.04em; }

.moods-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: .8rem; margin-top: 1.5rem;
}
@media (max-width: 1100px) { .moods-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .moods-row { grid-template-columns: 1fr; } }
.mood-card {
  padding: 1.4rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
.mood-card::before {
  content: ''; position: absolute; inset: 0;
  background: var(--mood-bg);
  opacity: .14;
  z-index: 0;
}
.mood-card > * { position: relative; z-index: 1; }
.mood-card .lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.16em;
  color: var(--accent);
  text-transform: uppercase;
}
.mood-card h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1.2rem;
  color: var(--ink);
  margin: .5rem 0 .4rem;
  letter-spacing: -0.01em;
  text-transform: uppercase;
}
.mood-card .tag {
  font-size: 0.82rem; line-height: 1.5;
  color: var(--ink-soft);
}
.mood-card .use {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.16em;
  color: var(--accent3);
  text-transform: uppercase;
  margin-top: .8rem;
  padding-top: .8rem;
  border-top: 1px dashed var(--line);
}

.do-dont {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1rem; margin-top: 1.8rem;
}
@media (max-width: 700px) { .do-dont { grid-template-columns: 1fr; } }
.do-card, .dont-card {
  padding: 1.5rem 1.4rem;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.do-card { background: rgba(201,242,92,0.04); border-color: rgba(201,242,92,0.20); }
.dont-card { background: rgba(255,90,31,0.04); border-color: rgba(255,90,31,0.20); }
.do-card h5, .dont-card h5 {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: .5rem;
}
.do-card h5 { color: var(--accent2); }
.dont-card h5 { color: var(--accent); }
.do-card h5::before, .dont-card h5::before {
  content: ''; width: 18px; height: 1px; background: currentColor;
}
.do-card ul, .dont-card ul {
  list-style: none;
  display: flex; flex-direction: column; gap: .55rem;
}
.do-card ul li, .dont-card ul li {
  font-size: 0.88rem; line-height: 1.6;
  color: var(--ink-soft);
  padding-left: 1.2rem;
  position: relative;
}
.do-card ul li::before { content: '✓'; position: absolute; left: 0; color: var(--accent2); font-weight: 600; }
.dont-card ul li::before { content: '✕'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }

/* ====================================
   FUNNEL DIAGRAM
   ==================================== */
.funnel-block { display: flex; flex-direction: column; gap: 1rem; }
.funnel-stage {
  display: grid; grid-template-columns: 80px 1fr 1.4fr;
  gap: 2rem;
  padding: 1.8rem 1.6rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  position: relative;
  transition: border-color .25s, box-shadow .25s;
}
@media (max-width: 900px) {
  .funnel-stage { grid-template-columns: 1fr; gap: 1rem; }
}
.funnel-stage:hover { border-color: var(--accent); box-shadow: 0 22px 50px -16px rgba(255,90,31,0.18); }
.funnel-stage .stage-num {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 3.2rem; line-height: 1;
  color: var(--accent);
  letter-spacing: -0.04em;
}
.funnel-stage .stage-mid h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.5rem; line-height: 1.1; letter-spacing: -0.015em;
  color: var(--ink);
  text-transform: uppercase;
  margin-bottom: .7rem;
}
.funnel-stage .stage-mid p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
}
.funnel-stage .stage-mid .kpi {
  display: inline-block; margin-top: .9rem;
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent3);
  border: 1px solid rgba(242,193,43,0.30);
  padding: .3rem .6rem; border-radius: 100px;
  background: rgba(242,193,43,0.06);
}
.funnel-stage .stage-levers {
  display: flex; flex-direction: column; gap: .55rem;
}
.funnel-stage .stage-levers .lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-bottom: .35rem;
}
.funnel-stage .stage-levers ul {
  list-style: none;
  display: flex; flex-direction: column; gap: .45rem;
}
.funnel-stage .stage-levers li {
  font-size: 0.85rem; line-height: 1.55;
  color: var(--ink-soft);
  padding-left: 1.2rem;
  position: relative;
}
.funnel-stage .stage-levers li::before {
  content: '◦'; position: absolute; left: 0;
  color: var(--accent);
  font-weight: 600;
}

/* ====================================
   GOOGLE / META ADS
   ==================================== */
.ads-line {
  display: grid; grid-template-columns: 90px 1.2fr 2fr 120px;
  gap: 1.5rem;
  padding: 1.4rem 1.4rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  margin-bottom: .85rem;
  transition: border-color .25s, box-shadow .25s;
}
@media (max-width: 900px) {
  .ads-line { grid-template-columns: 1fr; gap: .8rem; }
}
.ads-line:hover { border-color: var(--accent); }
.ads-line .num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.65rem; letter-spacing: 0.2em;
  color: var(--accent);
  background: rgba(255,90,31,0.12);
  padding: .35rem .55rem; border-radius: 4px;
  align-self: flex-start;
  text-transform: uppercase;
  display: inline-block;
}
.ads-line .main h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.2rem; line-height: 1.15;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .35rem;
}
.ads-line .main .focus {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  color: var(--accent3);
  text-transform: uppercase;
  margin-bottom: .6rem;
}
.ads-line .main p {
  font-size: 0.85rem; line-height: 1.6;
  color: var(--ink-soft);
}
.ads-line .kw {
  display: flex; flex-direction: column; gap: .45rem;
}
.ads-line .kw .lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
}
.ads-line .kw-list { display: flex; flex-wrap: wrap; gap: .35rem; }
.ads-line .kw-list span {
  font-family: 'Geist Mono', monospace;
  font-size: 0.66rem;
  padding: .25rem .55rem;
  background: rgba(244,236,220,0.04);
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink-soft);
}
.ads-line .kw .land {
  margin-top: .25rem;
  font-size: 0.78rem;
  color: var(--ink);
}
.ads-line .kw .land b { color: var(--accent); font-weight: 500; }
.ads-line .budget {
  display: flex; flex-direction: column;
  align-items: flex-end;
  gap: .3rem;
}
.ads-line .budget .pct {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 2.4rem;
  color: var(--accent2);
  letter-spacing: -0.02em;
  line-height: 1;
}
.ads-line .budget .lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
}

/* META PHASES */
.meta-phases { display: flex; flex-direction: column; gap: 1rem; }
.meta-phase {
  display: grid; grid-template-columns: 100px 1fr;
  gap: 2rem;
  padding: 1.8rem 1.6rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  transition: border-color .25s;
}
@media (max-width: 700px) {
  .meta-phase { grid-template-columns: 1fr; gap: 1rem; }
}
.meta-phase:hover { border-color: var(--accent); }
.meta-phase .num {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 3rem;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.04em;
}
.meta-phase h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .25rem;
}
.meta-phase .objective {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--accent);
  margin-bottom: 1rem;
}
.meta-phase p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
  margin-bottom: 1rem;
}
.meta-phase .meta-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: .8rem;
  padding-top: 1rem;
  border-top: 1px dashed var(--line);
}
@media (max-width: 700px) { .meta-phase .meta-grid { grid-template-columns: 1fr; } }
.meta-grid .item {
  padding: .8rem .9rem;
  background: rgba(244,236,220,0.02);
  border-radius: 6px;
  border: 1px solid var(--line);
}
.meta-grid .item .k {
  font-family: 'Geist Mono', monospace;
  font-size: 0.56rem; letter-spacing: 0.18em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin-bottom: .25rem;
}
.meta-grid .item .v {
  font-family: 'Geist', sans-serif;
  font-size: 0.85rem;
  color: var(--ink);
  font-weight: 500;
}

/* CREATIVE MATRIX */
.creative-matrix {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: .8rem;
  margin-top: 2rem;
}
@media (max-width: 1100px) { .creative-matrix { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .creative-matrix { grid-template-columns: 1fr; } }
.creative-card {
  padding: 1.4rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  transition: border-color .25s, transform .25s;
}
.creative-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.creative-card .ang {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.2em;
  color: var(--accent);
  background: rgba(255,90,31,0.10);
  padding: .3rem .55rem; border-radius: 4px;
  display: inline-block; margin-bottom: 1rem;
  text-transform: uppercase;
}
.creative-card .hook {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.05rem; line-height: 1.2;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: 1rem;
  min-height: 50px;
}
.creative-card .format,
.creative-card .cta-line {
  font-family: 'Geist Mono', monospace;
  font-size: 0.66rem;
  color: var(--ink-soft);
  line-height: 1.5;
  margin-top: .4rem;
}
.creative-card .format b,
.creative-card .cta-line b {
  color: var(--accent3);
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ====================================
   WEB MADRE · MOCKUP
   ==================================== */
.webmother-block {
  display: grid; grid-template-columns: 1.2fr 1.8fr;
  gap: 2rem;
  align-items: flex-start;
}
@media (max-width: 1100px) { .webmother-block { grid-template-columns: 1fr; } }
.web-meta {
  padding: 1.6rem 1.4rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
}
.web-meta h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.015em;
  margin-bottom: .5rem;
}
.web-meta h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent);
  font-weight: 400;
  text-transform: none;
}
.web-meta p {
  font-size: 0.92rem; line-height: 1.65;
  color: var(--ink-soft);
  margin-bottom: 1.2rem;
}
.web-sections-list {
  display: flex; flex-direction: column; gap: .55rem;
}
.web-sect-row {
  display: grid; grid-template-columns: 38px 1fr;
  gap: .9rem;
  padding: .8rem .9rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(244,236,220,0.02);
  transition: all .2s;
}
.web-sect-row:hover { border-color: var(--accent); background: rgba(255,90,31,0.04); }
.web-sect-row .num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  letter-spacing: 0.05em;
}
.web-sect-row .label {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 0.95rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .15rem;
}
.web-sect-row .desc {
  font-size: 0.78rem; line-height: 1.5;
  color: var(--ink-soft);
}
.web-tech {
  margin-top: 1.5rem; padding-top: 1.2rem;
  border-top: 1px dashed var(--line);
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem; line-height: 1.6;
  color: var(--accent3);
  letter-spacing: 0.04em;
}

/* BROWSER MOCKUP */
.browser-mockup {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--bg);
  box-shadow: 0 30px 70px -20px rgba(0,0,0,0.55);

}
.browser-bar {

  padding: .7rem .9rem;
  border-bottom: 1px solid var(--line);

}
.browser-bar .dot {
  width: 11px; height: 11px; border-radius: 50%;
  background: #36322a;
}
.browser-bar .dot.r { background: #ff5a3c; }
.browser-bar .dot.y { background: #f2c12b; }
.browser-bar .dot.g { background: #c9f25c; }
.browser-bar .url {
  margin-left: 1rem;
  padding: .35rem .7rem;

}
.mock-hero .nav .logo-mark {

.mock-hero .nav .menu { display: flex; gap: 1.2rem; }
.mock-hero .kicker {
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.2em;

  padding: .35rem .7rem;
  border-radius: 100px;

}
.mock-hero h1 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: clamp(1.6rem, 3.4vw, 2.6rem);

  text-transform: uppercase;

}
.mock-hero h1 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;

.mock-hero .sub {

.mock-hero .cta-row {

}
.mock-stats .m { text-align: left; }
.mock-stats .v {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--accent);
  letter-spacing: -0.01em;
  line-height: 1;
}
.mock-stats .k {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem;
  color: var(--ink-soft);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: .35rem;

}

.mock-cap {
  padding: 2rem;

  border-bottom: 1px solid var(--line);
}
.mock-cap .kick {
  font-family: 'Geist Mono', monospace;

}
@media (max-width: 700px) { .mock-cap-grid { grid-template-columns: 1fr; } }
.mock-cap-card {
  padding: 1.4rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 10px;

}
.mock-cap-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--card-accent, var(--accent));
}
.mock-cap-card .ix {

.mock-cases h3 {

/* ====================================
   LANDING MOCKUPS
   ==================================== */

}

}
.land-meta h3 {

}
.land-meta h3 em {

.land-sect {

}

}
.land-sect .label {
  font-family: 'Bricolage Grotesque', sans-serif;

}
.land-sect .detail {

.proof-cell {
  padding: .9rem .8rem;

  background: var(--bg);
}
.proof-cell .k {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.4rem;
  color: var(--land-accent);
  letter-spacing: -0.01em;
  line-height: 1;
}
.proof-cell .v {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem;
  color: var(--ink-soft);

}
.land-mock-hero {

}

}

.land-mock-hero h2 {

  letter-spacing: -0.025em;
  color: var(--ink);
  text-transform: uppercase;
  margin-bottom: .9rem;

}
.land-mock-hero h2 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;

  text-transform: none;
  letter-spacing: 0;
}
.land-mock-hero .sub {
  font-size: 0.88rem; line-height: 1.65;

}
.land-mock-hero .cta-row { display: flex; gap: .6rem; flex-wrap: wrap; }
.land-mock-hero .land-cta-primary {
  background: var(--land-accent); color: var(--bg);
  font-family: 'Geist', sans-serif; font-weight: 600;
  padding: .6rem 1.2rem;
  border-radius: 100px;
  font-size: 0.78rem;
  letter-spacing: 0.02em;
}
.land-mock-hero .land-cta-secondary {
  background: transparent; color: var(--ink);
  border: 1px solid var(--line-strong);
  font-family: 'Geist', sans-serif; font-weight: 600;
  padding: .6rem 1.2rem;
  border-radius: 100px;
  font-size: 0.78rem;
  letter-spacing: 0.02em;
}

.land-mock-row {
  padding: 1.5rem 1.8rem;
  border-bottom: 1px solid var(--line);
}
.land-mock-row .row-kick {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;

}
.land-mock-row .row-grid {

}

.land-mock-row .row-cell {

}
.land-mock-row .row-cell h5 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 0.85rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .4rem;
}
.land-mock-row .row-cell p {
  font-size: 0.72rem; line-height: 1.5;
  color: var(--ink-soft);
}

.land-mock-form {
  padding: 1.5rem 1.8rem;
  background: linear-gradient(180deg, transparent, var(--bg2));
}
.land-mock-form h4 {
  font-family: 'Bricolage Grotesque', sans-serif;

}
.land-form-row {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: .55rem; margin-bottom: .55rem;
}

.land-input {

}
.land-submit {
  margin-top: .5rem;
  background: var(--land-accent); color: var(--bg);

/* ====================================
   ECO SECTION
   ==================================== */
.eco-stages {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: .8rem; margin-top: 1.5rem;
}
@media (max-width: 1100px) { .eco-stages { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .eco-stages { grid-template-columns: 1fr; } }
.eco-stage {
  padding: 1.5rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(201,242,92,0.04), transparent);
  position: relative;
  transition: border-color .25s;
}
.eco-stage:hover { border-color: var(--accent2); }
.eco-stage .num {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 2.4rem;
  line-height: 1;

  letter-spacing: -0.04em;
}
.eco-stage h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.15rem;

  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin: .8rem 0 .4rem;
}

  font-size: 0.82rem; line-height: 1.55;

}

.eco-kpis-row {
  display: grid; grid-template-columns: repeat(4, 1fr);

}

.eco-kpi {

  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
}
.eco-kpi .v {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent2);
  font-size: 1.5rem; line-height: 1;
}
.eco-kpi .k {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem;
  color: var(--ink-soft);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: .35rem;
  display: block;
}

.eco-uses {
  margin-top: 1.5rem;
  display: flex; flex-direction: column; gap: .55rem;
}
.eco-use {
  padding: .9rem 1.1rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(201,242,92,0.04);
  font-size: 0.9rem; line-height: 1.6;
  color: var(--ink-soft);
  padding-left: 2.2rem;
  position: relative;
}
.eco-use::before {
  content: '◆'; position: absolute; left: .9rem; top: .9rem;
  color: var(--accent2);
}

/* ====================================
   PORTAFOLIO · CASOS · (clase legacy "tini-block" mantenida por routing)
   ==================================== */
.tini-block {
  padding: 2.5rem 2rem;
  border: 1px solid var(--accent3);
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(242,193,43,0.06), rgba(255,90,31,0.04));
  position: relative;
  overflow: hidden;
}
.tini-block::before {
  content: 'PORTAFOLIO';
  position: absolute; top: -20px; right: -20px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 11rem;
  color: rgba(255,90,31,0.05);
  letter-spacing: -0.05em;
  pointer-events: none;
  line-height: 1;
}
.tini-block > * { position: relative; }
.tini-block h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: clamp(1.6rem, 3.6vw, 2.4rem);
  line-height: 1.05;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
  max-width: 800px;
}
.tini-block h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--accent3);
  font-weight: 400;
  text-transform: none;
}
.tini-block .why {
  font-size: 1rem; line-height: 1.7;
  color: var(--ink-soft);
  max-width: 720px;
  margin-bottom: 2rem;
}
.tini-block .why b { color: var(--accent); font-weight: 500; }

.tini-steps {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: .65rem;
  margin-top: 1.5rem;
}
@media (max-width: 1100px) { .tini-steps { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .tini-steps { grid-template-columns: 1fr; } }
.tini-step {
  padding: 1.2rem 1rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg2);
}
.tini-step .num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.2em;
  color: var(--accent3);
  text-transform: uppercase;
  margin-bottom: .6rem;
}
.tini-step h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1rem; line-height: 1.2;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .5rem;
}
.tini-step p {
  font-size: 0.78rem; line-height: 1.55;
  color: var(--ink-soft);
}

/* ====================================
   ROADMAP
   ==================================== */
.road-list {
  display: flex; flex-direction: column; gap: .85rem;
  position: relative;
}
.road-list::before {
  content: ''; position: absolute;
  left: 65px; top: 30px; bottom: 30px; width: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent2));
  opacity: .25;
}
@media (max-width: 700px) { .road-list::before { display: none; } }
.road-step {
  display: grid; grid-template-columns: 130px 1fr;
  gap: 1.5rem;
  padding: 1.3rem 1.4rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg2);
  position: relative;
  transition: border-color .25s, box-shadow .25s;
}
@media (max-width: 700px) {
  .road-step { grid-template-columns: 1fr; gap: .8rem; }
}
.road-step:hover {
  border-color: var(--accent);
  box-shadow: 0 18px 40px -16px rgba(255,90,31,0.20);
}
.road-step .mo {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 2.3rem;
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1;
}
.road-step .right h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .3rem;
}
.road-step .right .focus {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 1rem;
  color: var(--accent);
  margin-bottom: .9rem;

.road-step .right ul {
  list-style: none;
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: .55rem;
}
@media (max-width: 800px) { .road-step .right ul { grid-template-columns: 1fr; } }
.road-step .right li {
  font-size: 0.84rem; line-height: 1.5;
  color: var(--ink-soft);
  padding-left: 1rem;
  position: relative;
}
.road-step .right li::before {
  content: '◦'; position: absolute; left: 0;
  color: var(--accent2);
}

/* ====================================
   INVEST
   ==================================== */
.invest-block {
  display: flex; flex-direction: column; gap: 1rem;
}
.invest-phase {
  padding: 1.8rem 1.5rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  display: grid; grid-template-columns: 200px 1fr;
  gap: 2rem;
  transition: border-color .25s;
}
@media (max-width: 900px) {
  .invest-phase { grid-template-columns: 1fr; gap: 1rem; }
}
.invest-phase:hover { border-color: var(--accent); }
.invest-phase .id {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: .25rem;
}
.invest-phase .name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1.25rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: 1.1;
  margin-bottom: .55rem;

  font-style: italic;
  font-size: 0.92rem;
  color: var(--accent3);

  list-style: none;
  display: flex; flex-direction: column;
  gap: .55rem;
}
.invest-phase ul li {
  font-size: 0.9rem; line-height: 1.55;
  color: var(--ink-soft);
  padding-left: 1.2rem;
  position: relative;
}
.invest-phase ul li::before {
  content: '✓'; position: absolute; left: 0;
  color: var(--accent2);
  font-weight: 600;
}

.audit-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1rem;
}
@media (max-width: 900px) { .audit-grid { grid-template-columns: 1fr; } }
.audit-card {
  padding: 1.6rem 1.4rem;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.audit-card.works  { background: rgba(201,242,92,0.04); border-color: rgba(201,242,92,0.20); }
.audit-card.breaks { background: rgba(255,90,31,0.04); border-color: rgba(255,90,31,0.20); }
.audit-card .head {
  display: flex; align-items: center; gap: .55rem;
  margin-bottom: 1rem;
}
.audit-card .head .ico {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 1.4rem;
  width: 34px; height: 34px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.audit-card.works  .head .ico { background: rgba(201,242,92,0.16); color: var(--accent2); }
.audit-card.breaks .head .ico { background: rgba(255,90,31,0.18); color: var(--accent); }
.audit-card h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1.2rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
}
.audit-card ul {
  list-style: none;
  display: flex; flex-direction: column; gap: .55rem;
}
.audit-card ul li {
  font-size: 0.88rem; line-height: 1.55;
  color: var(--ink-soft);
  padding-left: 1.2rem;
  position: relative;
}
.audit-card.works ul li::before  { content: '✓'; position: absolute; left: 0; color: var(--accent2); font-weight: 600; }
.audit-card.breaks ul li::before { content: '✕'; position: absolute; left: 0; color: var(--accent); font-weight: 600; }
.audit-card ul li b { color: var(--ink); font-weight: 500; }

/* LOGO SECTION */

.logo-vis-card {

.logo-vis-card.light { background: var(--ink); }

.logo-meta { padding: 0; }
.logo-meta h3 {
  font-family: 'Bricolage Grotesque', sans-serif;

.logo-element {

}
.logo-element .lbl {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.16em;
  color: var(--accent);
  text-transform: uppercase;
}
.logo-element .val {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .25rem;
}
.logo-element .meaning {
  font-size: 0.82rem; line-height: 1.55;
  color: var(--ink-soft);
}

.logo-bullets {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: .85rem;
  margin-top: 1.5rem;
}
@media (max-width: 900px) { .logo-bullets { grid-template-columns: 1fr; } }
.logo-bullet-card {
  padding: 1.4rem 1.3rem;

}
.logo-bullet-card.s { border-left: 3px solid var(--accent2); }
.logo-bullet-card.w { border-left: 3px solid var(--accent); }
.logo-bullet-card.r { border-left: 3px solid var(--accent3); }
.logo-bullet-card .head {
  display: flex; align-items: center; gap: .55rem;
  margin-bottom: .9rem;
}
.logo-bullet-card .head .ico {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800; font-size: 1rem;
  width: 28px; height: 28px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.logo-bullet-card.s .head .ico { background: rgba(201,242,92,0.16); color: var(--accent2); }
.logo-bullet-card.w .head .ico { background: rgba(255,90,31,0.18); color: var(--accent); }
.logo-bullet-card.r .head .ico { background: rgba(242,193,43,0.18); color: var(--accent3); }
.logo-bullet-card h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1rem;
  color: var(--ink);

}
.logo-bullet-card ul { list-style: none; display: flex; flex-direction: column; gap: .5rem; }
.logo-bullet-card ul li {
  font-size: 0.82rem; line-height: 1.5;

}
.logo-bullet-card ul li::before {
  content: '·'; position: absolute; left: 0;
  font-weight: 600;
  font-size: 1.3rem;
  top: -.3em;
}
.logo-bullet-card.s ul li::before { color: var(--accent2); }
.logo-bullet-card.w ul li::before { color: var(--accent); }
.logo-bullet-card.r ul li::before { color: var(--accent3); }

/* PILLARS SECTION DETAIL */
.pillars-detail {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: .9rem; margin-top: 1.4rem;
}
@media (max-width: 1100px) { .pillars-detail { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .pillars-detail { grid-template-columns: 1fr; } }
.pillar-detail-card {
  padding: 1.5rem 1.3rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  display: flex; flex-direction: column; gap: .75rem;
  transition: border-color .25s, box-shadow .25s;
}
.pillar-detail-card:hover { border-color: var(--accent); box-shadow: 0 20px 45px -16px rgba(255,90,31,0.18); }
.pillar-detail-card .head { display: flex; justify-content: space-between; align-items: center; }
.pillar-detail-card .head .kicker {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.16em;
  color: var(--accent);
  background: rgba(255,90,31,0.10);
  padding: .25rem .55rem; border-radius: 4px;
  text-transform: uppercase;
}
.pillar-detail-card .head .wt {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 1.4rem;
  color: var(--accent3);
  letter-spacing: -0.02em;
}
.pillar-detail-card h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1.2rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  line-height: 1.1;
}
.pillar-detail-card p {
  font-size: 0.85rem; line-height: 1.6;
  color: var(--ink-soft);
}
.pillar-detail-card .formats {
  display: flex; flex-wrap: wrap; gap: .35rem;
  margin-top: .35rem;
}
.pillar-detail-card .formats span {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem;
  padding: .22rem .5rem;
  border: 1px solid var(--line);
  border-radius: 100px;
  color: var(--ink-soft);
}
.pillar-detail-card .cadence {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.14em;
  color: var(--accent2);
  text-transform: uppercase;
  padding-top: .55rem;
  border-top: 1px dashed var(--line);
  margin-top: .25rem;
}

/* CAPS / PRODUCTS GRID */
.caps-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: .8rem;
}
@media (max-width: 1100px) { .caps-row { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .caps-row { grid-template-columns: 1fr; } }
.cap-card {
  padding: 1.3rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg2);
  transition: border-color .25s, transform .25s;
}
.cap-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.cap-card .ix {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.18em;
  color: var(--accent);
  text-transform: uppercase;
}
.cap-card h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1.1rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin: .5rem 0 .4rem;
}
.cap-card p {
  font-size: 0.82rem; line-height: 1.55;
  color: var(--ink-soft);
}

/* CASES carousel-like */
.cases-row {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: .9rem;
  margin-top: 1.5rem;
}
@media (max-width: 800px) { .cases-row { grid-template-columns: 1fr; } }
.case-card {
  padding: 1.5rem 1.4rem;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg2);
  transition: border-color .25s, box-shadow .25s;
}
.case-card:hover { border-color: var(--accent3); box-shadow: 0 18px 40px -16px rgba(242,193,43,0.18); }
.case-card .tag {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  color: var(--accent3);
  background: rgba(242,193,43,0.10);
  padding: .3rem .55rem; border-radius: 4px;
  display: inline-block;
  text-transform: uppercase;
  margin-bottom: .9rem;
}
.case-card h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700; font-size: 1.25rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin-bottom: .55rem;
}
.case-card p {
  font-size: 0.88rem; line-height: 1.65;
  color: var(--ink-soft);
}

/* TONE */
.tone-block {
  padding: 2rem 1.8rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg2);
  margin-bottom: 1.5rem;
}
.tone-block .voice {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 1.5rem;
  color: var(--accent);
  line-height: 1.3;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px dashed var(--line);
}
.territory {
  display: inline-block;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.8rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.015em;
  border-bottom: 3px solid var(--accent);
  padding-bottom: .3rem;
  margin-bottom: 1.5rem;
  line-height: 1;
}

/* tilt baseline */
.tilt { will-change: transform; transform-style: preserve-3d; }

/* anchor scroll smoothing */
html { scroll-behavior: smooth; }

/* utility */
.tag-pill {
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: .35rem .65rem;
  border-radius: 100px;
  background: rgba(255,90,31,0.08);
  border: 1px solid rgba(255,90,31,0.25);
  color: var(--accent);
}

/* cursor custom */
.cursor-trail {
  position: fixed; pointer-events: none; z-index: 9999;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent);
  mix-blend-mode: difference;
  transform: translate(-50%, -50%);
  transition: opacity .25s;
}
@media (hover: none) { .cursor-trail { display: none; } }

/* ====================================
   STYLES OVERVIEW (3 estilos comparados)
   ==================================== */
.styles-overview {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1rem; margin-top: 1.5rem;
}
@media (max-width: 1100px) { .styles-overview { grid-template-columns: 1fr; } }
.style-card-mini {
  position: relative; padding: 0; overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg2);
  transition: border-color .25s, transform .25s, box-shadow .25s;
  cursor: pointer;
}
.style-card-mini:hover {
  transform: translateY(-4px);

}

  width: 100%; aspect-ratio: 16 / 10;

  border-bottom: 1px solid var(--line);

}

  content: ''; position: absolute; inset: 0;

  position: absolute; top: 1rem; left: 1rem;

  padding: 1.4rem 1.4rem 1.5rem;
}
.style-card-mini .scm-name {
  font-family: 'Bricolage Grotesque', sans-serif;

  letter-spacing: -0.02em;
  margin-bottom: .4rem;
}
.style-card-mini .scm-name em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;

.style-card-mini .scm-tag {
  font-family: 'Geist Mono', monospace;

}
.style-card-mini .scm-insight {
  font-family: 'Instrument Serif', serif;
  font-style: italic;

}
.style-card-mini .scm-thesis {
  font-size: 0.85rem; line-height: 1.6;

}
.style-card-mini .scm-open {
  display: inline-flex; align-items: center; gap: .5rem;
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.18em;

  text-transform: uppercase;

  border-top: 1px solid var(--line);
}

/* ====================================
   STYLE FULL PREVIEW
   ==================================== */
.style-shell {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  background: var(--style-bg);
  color: var(--style-ink);
  box-shadow: 0 40px 80px -28px rgba(0,0,0,0.6);
  margin-top: 1.5rem;
  border: 1px solid var(--style-line);
}

  display: flex; align-items: center; gap: .55rem;
  padding: .7rem .9rem;
  background: var(--style-bg2);
  border-bottom: 1px solid var(--style-line);
}
.style-shell .ss-browser .dot {
  width: 11px; height: 11px; border-radius: 50%;
}
.style-shell .ss-browser .url {
  margin-left: 1rem;
  padding: .35rem .8rem;
  background: var(--style-bg);
  border: 1px solid var(--style-line);
  border-radius: 100px;
  font-family: 'Geist Mono', monospace;
  font-size: 0.66rem;

}

  content: ''; position: absolute; inset: 0;

.style-hero .sh-logo-mark {

}
.style-hero .sh-title em {
  font-family: var(--style-italic, 'Instrument Serif'), serif;

.style-hero .sh-sub {

.style-hero .sh-stat .v {

/* Body sections of the style web */
.style-body {
  padding: 2.5rem 2.5rem;
  background: var(--style-bg);
}
@media (max-width: 700px) { .style-body { padding: 1.8rem 1.4rem; } }
.style-section-row {
  display: grid; grid-template-columns: 80px 1fr;
  gap: 1.5rem;
  padding: 1.8rem 0;
  border-bottom: 1px solid var(--style-line);
  align-items: flex-start;
}
@media (max-width: 700px) { .style-section-row { grid-template-columns: 1fr; gap: .8rem; } }
.style-section-row:last-child { border-bottom: 0; }
.style-section-row .ssr-num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.18em;
  color: var(--style-accent);
  padding-top: .4rem;
  text-transform: uppercase;
}
.style-section-row .ssr-content { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2rem; align-items: center; }

  font-family: 'Bricolage Grotesque', sans-serif;

  letter-spacing: -0.005em;
  margin-bottom: .35rem;
}
.rb-phase p {
  font-size: 0.74rem; line-height: 1.5;

}

/* ====================================
   GRAPHIC SYSTEM · per web style
   ==================================== */
.gs-shell {
  margin-top: 1.5rem;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--bg2);
  overflow: hidden;
}
.gs-head {
  padding: 2rem 1.8rem 1.5rem;
  background: linear-gradient(135deg, var(--gs-accent) 0%, transparent 45%);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.gs-head::after {
  content: ''; position: absolute; right: 1.8rem; top: 50%; transform: translateY(-50%);
  width: 80px; height: 80px;
  background: var(--gs-accent); opacity: .12;
  border-radius: 50%;
  filter: blur(40px);
}
.gs-head .kicker {
  font-family: 'Geist Mono', monospace;
  font-size: 0.66rem; letter-spacing: 0.22em;
  color: var(--gs-accent);

  margin-bottom: .8rem;
  display: inline-block;
}
.gs-head h3 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: clamp(1.6rem, 3.6vw, 2.4rem);
  line-height: 1;
  letter-spacing: -0.022em;
  color: var(--ink);
  text-transform: uppercase;
  margin-bottom: .8rem;
}
.gs-head h3 em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  color: var(--gs-accent);
  font-weight: 400;
  text-transform: none;
}
.gs-head p {
  font-size: 0.95rem; line-height: 1.65;
  color: var(--ink-soft);
  max-width: 720px;
}

.gs-section {
  padding: 1.8rem 1.8rem;
  border-bottom: 1px dashed var(--line);
}
.gs-section:last-child { border-bottom: 0; }
.gs-section h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 1.2rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.01em;
  margin-bottom: .55rem;
  display: flex; align-items: baseline; gap: .8rem;
  flex-wrap: wrap;
}
.gs-section h4 .gs-num {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.2em;
  color: var(--gs-accent);
  font-weight: 600;
  text-transform: uppercase;
}
.gs-section .gs-intro {
  font-size: 0.88rem; line-height: 1.6;
  color: var(--ink-soft);
  margin-bottom: 1.2rem;
  max-width: 720px;
}

/* LOGO applications */
.gs-logo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .65rem; }
@media (max-width: 900px) { .gs-logo-grid { grid-template-columns: repeat(2, 1fr); } }
.gs-logo-card {
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  border: 1px solid var(--line);
  padding: 1.5rem;
}
.gs-logo-card .wm {
  font-family: var(--gs-script, 'Caprasimo'), serif;
  font-weight: 400;
  font-size: clamp(1.4rem, 2.8vw, 2.2rem);
  line-height: 1;
  text-align: center;
  letter-spacing: -0.01em;
}
.gs-logo-card .wm .kk {
  display: block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.5rem; letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: .55rem;
  opacity: .8;
}
.gs-logo-card .wm .em {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  display: block;
  font-size: 0.95em;
}
.gs-logo-card .lbl {
  position: absolute; bottom: .6rem; left: .8rem;
  font-family: 'Geist Mono', monospace;
  font-size: 0.5rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: .7;
}

/* PALETA detallada */
.gs-palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: .55rem; }
@media (max-width: 1000px) { .gs-palette { grid-template-columns: repeat(2, 1fr); } }
.gs-palette-card {
  padding: 1.2rem 1.1rem;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  display: flex; flex-direction: column; gap: .7rem;
}
.gs-palette-card .swatch {
  width: 100%; height: 70px;
  border-radius: 8px;
  margin-bottom: .35rem;
  border: 1px solid var(--line);
}
.gs-palette-card .name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
}
.gs-palette-card .hex {
  font-family: 'Geist Mono', monospace;
  font-size: 0.7rem;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
}
.gs-palette-card .usage {
  font-size: 0.78rem; line-height: 1.5;
  color: var(--ink-soft);
  border-top: 1px dashed var(--line);
  padding-top: .55rem;
}

/* TIPOGRAFÍA jerarquía */
.gs-type-stack { display: flex; flex-direction: column; gap: .8rem; }
.gs-type-row {
  display: grid; grid-template-columns: 90px 1fr 200px;
  gap: 1.5rem;
  padding: 1.1rem 1.3rem;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  align-items: center;
}
@media (max-width: 900px) { .gs-type-row { grid-template-columns: 1fr; gap: .55rem; } }
.gs-type-row .role {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.2em;
  color: var(--gs-accent);
  text-transform: uppercase;
  font-weight: 600;
}
.gs-type-row .sample {
  color: var(--ink);
  line-height: 1;
}
.gs-type-row .spec {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.06em;
  color: var(--ink-soft);
  text-transform: uppercase;
  text-align: right;
}
@media (max-width: 900px) { .gs-type-row .spec { text-align: left; } }

/* MOOD fotográfico */
.gs-mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .65rem; }
@media (max-width: 800px) { .gs-mood-grid { grid-template-columns: 1fr; } }
.gs-mood-card {
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg);
  overflow: hidden;
}
.gs-mood-card .photo {
  aspect-ratio: 4 / 3;
  background-size: cover; background-position: center;
  background-color: var(--bg2);
}
.gs-mood-card .meta {
  padding: 1rem 1.2rem;
}
.gs-mood-card .meta .tag {
  font-family: 'Geist Mono', monospace;
  font-size: 0.58rem; letter-spacing: 0.18em;
  color: var(--gs-accent);
  text-transform: uppercase;
  margin-bottom: .35rem;
}
.gs-mood-card .meta h6 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .35rem;
}
.gs-mood-card .meta p {
  font-size: 0.78rem; line-height: 1.5;
  color: var(--ink-soft);
}

/* DO / DON'T visual */
.gs-rules { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 800px) { .gs-rules { grid-template-columns: 1fr; } }
.gs-rules-card {
  padding: 1.4rem 1.3rem;
  border-radius: 12px;
  border: 1px solid var(--line);
}
.gs-rules-card.do  { background: rgba(74,122,80,0.06); border-color: rgba(74,122,80,0.30); }
.gs-rules-card.dont { background: rgba(255,90,31,0.06); border-color: rgba(255,90,31,0.30); }
.gs-rules-card h5 {
  font-family: 'Geist Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 1rem;
  font-weight: 600;
}
.gs-rules-card.do h5 { color: #4A7A50; }
.gs-rules-card.dont h5 { color: var(--accent); }
.gs-rules-card ul { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
.gs-rules-card ul li {
  font-size: 0.85rem; line-height: 1.55;
  color: var(--ink-soft);
  padding-left: 1.4rem; position: relative;
}
.gs-rules-card.do ul li::before { content: '✓'; position: absolute; left: 0; color: #4A7A50; font-weight: 700; }
.gs-rules-card.dont ul li::before { content: '✕'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }

/* APLICACIONES · etiqueta, sticker, packaging, IG card */
.gs-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: .65rem; }
@media (max-width: 1000px) { .gs-apps { grid-template-columns: repeat(2, 1fr); } }
.gs-app {
  aspect-ratio: 3 / 4;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 1.2rem;
  border: 1px solid var(--line);
}
.gs-app .app-type {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 600;
}
.gs-app .app-name {
  font-family: var(--gs-script, 'Caprasimo'), serif;
  font-weight: 400;
  font-size: 1.4rem;
  line-height: 1;
}
.gs-app .app-meta {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: .8;
}

/* ====================================
   STYLE BODY RICH BLOCKS · custom visual mockups per section
   ==================================== */
.sb-section {
  padding: 2.5rem 0;
  border-bottom: 1px solid var(--style-line);
}
.sb-section:last-child { border-bottom: 0; }
.sb-kicker {
  display: inline-block;
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.2em;
  color: var(--style-accent);
  margin-bottom: 1rem;
  text-transform: uppercase;
}
.sb-title {
  font-family: var(--style-display, 'Bricolage Grotesque'), sans-serif;
  font-weight: var(--style-display-weight, 800);
  font-size: clamp(1.6rem, 3.5vw, 2.5rem);
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--style-ink);
  text-transform: uppercase;
  margin-bottom: 1rem;
}
.sb-title em {
  font-family: var(--style-italic, 'Instrument Serif'), serif;
  font-style: italic;

}
.sb-sub {
  font-family: var(--style-body, 'Geist'), sans-serif;
  font-size: 0.95rem; line-height: 1.65;
  color: var(--style-soft);
  max-width: 720px;
  margin-bottom: 2rem;
}

/* TALLER · capabilities grid */
.taller-caps { display: grid; grid-template-columns: repeat(4, 1fr); gap: .85rem; }
@media (max-width: 1100px) { .taller-caps { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px)  { .taller-caps { grid-template-columns: 1fr; } }
.taller-cap-card {
  padding: 1.4rem 1.2rem;
  border: 1px solid var(--style-line);
  border-radius: 12px;
  background: var(--style-bg2);
  transition: border-color .25s, transform .25s;
}
.taller-cap-card:hover { border-color: var(--style-accent); transform: translateY(-3px); }
.taller-cap-card .ix {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.2em;
  color: var(--style-accent);
  background: var(--style-bg);
  padding: .3rem .55rem; border-radius: 4px;
  display: inline-block;
  margin-bottom: .9rem;
  text-transform: uppercase;
}
.taller-cap-card h5 {
  font-family: var(--style-display), sans-serif;
  font-weight: 700; font-size: 1rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .4rem;
}
.taller-cap-card p {
  font-size: 0.78rem; line-height: 1.55;
  color: var(--style-soft);
  margin-bottom: .8rem;
}
.taller-cap-card .durability {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.1em;
  color: var(--style-accent);
  text-transform: uppercase;
  padding-top: .55rem;
  border-top: 1px dashed var(--style-line);
}

/* TALLER · editorial image-text split */
.taller-editorial {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 2rem; align-items: center;
}
@media (max-width: 900px) { .taller-editorial { grid-template-columns: 1fr; } }
.taller-editorial-img {
  aspect-ratio: 4 / 5;
  background-size: cover; background-position: center;
  border-radius: 14px;
  border: 1px solid var(--style-line);
}
.taller-editorial-text h6 {
  font-family: 'Geist Mono', monospace;
  font-size: 0.6rem; letter-spacing: 0.2em;
  color: var(--style-accent);
  text-transform: uppercase;
  margin-bottom: .9rem;
}
.taller-editorial-text h3 {
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: clamp(1.5rem, 3vw, 2.2rem);
  line-height: 1;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.02em;
  margin-bottom: 1rem;
}
.taller-editorial-text h3 em {
  font-family: var(--style-italic), serif;
  font-style: italic;
  color: var(--style-accent);
  font-weight: 400;
  text-transform: none;
}
.taller-editorial-text p {
  font-family: var(--style-body), sans-serif;
  font-size: 0.92rem; line-height: 1.7;
  color: var(--style-soft);
  margin-bottom: 1rem;
}
.taller-editorial-text .pull {
  font-family: var(--style-italic), serif;
  font-style: italic;
  font-size: 1.15rem;
  line-height: 1.4;
  color: var(--style-accent);
  padding: 1rem 0 1rem 1rem;
  border-left: 3px solid var(--style-accent);
  margin-bottom: 1rem;
}

/* TALLER cases row */
.taller-cases { display: flex; gap: .8rem; overflow-x: auto; padding-bottom: .5rem; }
.taller-case {
  flex: 0 0 280px;
  padding: 1.2rem 1.2rem;
  border: 1px solid var(--style-line);
  border-radius: 12px;
  background: var(--style-bg2);
}
.taller-case .tag {
  font-family: 'Geist Mono', monospace;
  font-size: 0.55rem; letter-spacing: 0.16em;
  color: var(--style-accent);
  background: var(--style-bg);
  padding: .3rem .55rem; border-radius: 4px;
  display: inline-block;
  margin-bottom: .8rem;
  text-transform: uppercase;
}
.taller-case h6 {
  font-family: var(--style-display), sans-serif;
  font-weight: 700; font-size: 1rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .55rem;
  line-height: 1.2;
}
.taller-case p {
  font-size: 0.78rem; line-height: 1.55;
  color: var(--style-soft);
}

/* TALLER process timeline */
.taller-process { display: grid; grid-template-columns: repeat(5, 1fr); gap: .55rem; }
@media (max-width: 1100px) { .taller-process { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .taller-process { grid-template-columns: 1fr; } }
.taller-step {
  padding: 1.2rem 1rem;
  border: 1px solid var(--style-line);
  border-radius: 10px;
  background: var(--style-bg);
  position: relative;
}
.taller-step .step-n {
  font-family: var(--style-display), sans-serif;
  font-weight: 800;
  font-size: 2rem;
  color: var(--style-accent);
  line-height: 1;
  letter-spacing: -0.03em;
  margin-bottom: .55rem;
}
.taller-step h6 {
  font-family: var(--style-display), sans-serif;
  font-weight: 700; font-size: 0.85rem;
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.005em;
  margin-bottom: .35rem;
}
.taller-step p {
  font-size: 0.7rem; line-height: 1.45;
  color: var(--style-soft);
}

/* POP · marquee */
.pop-marquee-wrap {
  margin: 1rem 0;
  padding: 1.6rem 0;
  border-top: 2px solid var(--style-accent);
  border-bottom: 2px solid var(--style-accent);
  overflow: hidden;
  position: relative;
  background: var(--style-bg);
}
.pop-marquee {
  display: flex; gap: 3rem;
  white-space: nowrap;
  animation: pop-marquee-scroll 30s linear infinite;
}
@keyframes pop-marquee-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.pop-marquee .item {
  font-family: var(--style-display), sans-serif;
  font-weight: 800;
  font-size: 2.4rem;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  color: var(--style-ink);
}
.pop-marquee .item em {
  font-family: var(--style-italic), serif;
  font-style: italic;
  color: var(--style-accent);
}
.pop-marquee .star {
  color: var(--style-accent);
  font-size: 1.8rem;
  display: inline-block;
  margin: 0 .5rem;
  transform: rotate(15deg);
}

/* POP · cards grid colorful */
.pop-cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 900px) { .pop-cards-grid { grid-template-columns: 1fr; } }

  padding: 1.6rem 1.5rem;
  border-radius: 14px;
  position: relative; overflow: hidden;
  min-height: 240px;
  display: flex; flex-direction: column; justify-content: space-between;
  transition: transform .25s;
}

.pop-card.c1 { background: var(--style-accent);  color: #FFFFFF; }
.pop-card.c2 { background: var(--style-accent2); color: #1A0610; }
.pop-card.c3 { background: var(--style-accent3); color: #1A0610; }
.pop-card .kk {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: .8;
}
.pop-card h5 {
  font-family: var(--style-display), sans-serif;
  font-weight: 900;
  font-size: 1.6rem;
  text-transform: uppercase;
  letter-spacing: -0.02em;
  line-height: 1;
  margin: 1rem 0 .8rem;
}
.pop-card p {
  font-size: 0.85rem;
  line-height: 1.5;
  opacity: .9;
  margin-bottom: 1rem;
}
.pop-card .arrow {
  font-family: var(--style-display), sans-serif;
  font-weight: 800;
  font-size: 2.5rem;
  line-height: 1;
  align-self: flex-end;
}

/* POP · video showcase block */

  display: grid; grid-template-columns: 280px 1fr;
  gap: 2rem; align-items: center;
  padding: 1.8rem 0;
}
@media (max-width: 800px) { .pop-showcase { grid-template-columns: 1fr; } }
.pop-showcase-phone {
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  border: 8px solid #0B0A08;

  width: 100%; height: 100%; object-fit: cover;
}
.pop-showcase-text h4 {
  font-family: var(--style-display), sans-serif;
  font-weight: 900;
  font-size: clamp(1.6rem, 3.4vw, 2.4rem);
  color: var(--style-ink);
  text-transform: uppercase;
  letter-spacing: -0.025em;
  line-height: 1;
  margin-bottom: 1rem;
}
.pop-showcase-text h4 em {
  font-family: var(--style-italic), serif;
  font-style: italic;
  color: var(--style-accent);
}
.pop-showcase-text p {
  font-size: 0.95rem; line-height: 1.65;
  color: var(--style-soft);
  margin-bottom: 1.2rem;
}
.pop-showcase-text .tags {
  display: flex; gap: .35rem; flex-wrap: wrap;
}
.pop-showcase-text .tags span {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  padding: .25rem .55rem;
  border: 1px solid var(--style-accent);
  border-radius: 100px;
  color: var(--style-accent);

/* POP agenda */
.pop-agenda { display: flex; flex-direction: column; gap: .55rem; }
.pop-agenda-row {
  display: grid; grid-template-columns: 90px 1fr 100px;
  gap: 1rem;
  padding: .8rem 1rem;
  background: var(--style-bg2);
  border: 1px solid var(--style-line);
  border-radius: 8px;
  align-items: center;
}
.pop-agenda-row .date {
  font-family: var(--style-display), sans-serif;
  font-weight: 900;
  font-size: 1.4rem;
  color: var(--style-accent);
  letter-spacing: -0.02em;
}
.pop-agenda-row .event {
  font-family: var(--style-display), sans-serif;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--style-ink);
  text-transform: uppercase;
}
.pop-agenda-row .event small {
